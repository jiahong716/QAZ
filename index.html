<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e7deca">
  <title>墨行山河 // 水墨跑酷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="墨行山河">
        <span class="brand-mark" aria-hidden="true">墨</span>
        <div>
          <p class="eyebrow">山水長卷・踏墨而行</p>
          <h1>墨行山河 <span>／ 水墨跑酷</span></h1>
        </div>
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="statusText">蓄勢待發</span></div>
    </header>

    <section class="hud" aria-label="遊戲資訊">
      <div class="metric">
        <span class="metric-label">行旅里程</span>
        <strong id="score">000000</strong>
      </div>
      <div class="metric best-metric">
        <span class="metric-label">最佳行程</span>
        <strong id="highScore">000000</strong>
      </div>
      <div class="metric kill-metric">
        <span class="metric-label">擊退 / 最佳</span>
        <strong><span id="kills">000</span><small>／ <span id="highKills">000</span></small></strong>
      </div>
      <div class="metric level-metric">
        <span class="metric-label">山勢險度</span>
        <strong id="level">01</strong>
      </div>
    </section>

    <section class="game-frame" aria-label="墨行山河遊戲區域">
      <div class="scanline" aria-hidden="true"></div>
      <canvas id="gameCanvas" width="1200" height="520" aria-label="水墨山水間奔跑的遊戲畫面"></canvas>
      <img class="player-sprite" id="playerSprite" src="people.gif" alt="" aria-hidden="true" draggable="false">
      <div class="game-overlay" id="gameOverlay">
        <div class="overlay-card">
          <span class="overlay-kicker" id="overlayKicker">山水長卷・徐徐展開</span>
          <h2 id="overlayTitle">踏墨啟程？</h2>
          <p id="overlayMessage">按下 Space 或 W 躍身避開山石，使用 X 擊退前方的山間守衛。</p>
          <button class="primary-button" id="startButton" type="button"><span>踏入山河</span><b>↗</b></button>
        </div>
      </div>
    </section>

    <footer class="controls">
      <div class="control-item"><kbd>SPACE</kbd><span>躍身</span></div>
      <div class="control-item"><kbd>W</kbd><span>躍身</span></div>
      <div class="control-item"><kbd>X</kbd><span>擊退</span></div>
      <div class="control-item"><kbd>P</kbd><span>暫歇</span></div>
      <div class="control-item"><kbd>R</kbd><span>重行</span></div>
      <div class="footer-note"><span class="signal-bars"><i></i><i></i><i></i><i></i></span> 山河無恙</div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
